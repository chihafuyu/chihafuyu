---
name: 🧹 Janitor — Clean Old Workflow Runs

"on":
  schedule:
    # Weekly on Sunday at 03:43 UTC (avoids top-of-hour congestion).
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Delete completed runs older than this many days"
        required: false
        default: 30
        type: number
      keep_per_workflow:
        description: "Always keep this many recent runs per workflow"
        required: false
        default: 5
        type: number
      max_delete:
        description: "Maximum number of runs to delete per execution"
        required: false
        default: 200
        type: number
      dry_run:
        description: "Preview what would be deleted without actually deleting"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: janitor
  cancel-in-progress: false

jobs:
  cleanup:
    # Only run from the default branch to avoid accidental cross-branch cleanup.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DAYS: ${{ inputs.days }}
          KEEP_PER_WORKFLOW: ${{ inputs.keep_per_workflow }}
          MAX_DELETE: ${{ inputs.max_delete }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const currentRunId = context.runId;

            // ── Helpers ──────────────────────────────────────────────
            const num = (name, fallback, minimum) => {
              const raw = process.env[name];
              const v = raw === undefined || raw === "" ? fallback : Number(raw);
              return Number.isFinite(v) ? Math.max(minimum, Math.trunc(v)) : fallback;
            };

            const days             = num("DAYS", 30, 1);
            const keepPerWorkflow  = num("KEEP_PER_WORKFLOW", 5, 0);
            const maxDelete        = num("MAX_DELETE", 200, 1);
            const dryRun           = process.env.DRY_RUN === "true";
            const cutoff           = new Date(Date.now() - days * 86_400_000);

            core.info(`Repository : ${owner}/${repo}`);
            core.info(`Cutoff     : ${cutoff.toISOString()} (${days} day${days !== 1 ? "s" : ""})`);
            core.info(`Keep recent: ${keepPerWorkflow} per workflow`);
            core.info(`Delete cap : ${maxDelete}`);
            if (dryRun) core.notice("🔍 DRY RUN — nothing will be deleted.");

            // ── Fetch completed runs only (reduces payload + pagination) ─
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status: "completed", per_page: 100 }
            );

            core.info(`Total completed runs in repo: ${runs.length}`);

            // Newest first so the first N per workflow are the keepers.
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const seenPerWorkflow = new Map();
            const candidates = [];

            for (const run of runs) {
              if (run.id === currentRunId) continue;

              const seen = seenPerWorkflow.get(run.workflow_id) ?? 0;
              seenPerWorkflow.set(run.workflow_id, seen + 1);
              if (seen < keepPerWorkflow) continue;

              if (new Date(run.created_at) >= cutoff) continue;

              candidates.push(run);
            }

            // Oldest first — if the cap is hit, newer history survives.
            candidates.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const toDelete = candidates.slice(0, maxDelete);

            core.info(`Expired runs found : ${candidates.length}`);
            core.info(`Runs to delete     : ${toDelete.length}`);

            // ── Deletion loop ────────────────────────────────────────
            let deleted = 0;
            let skipped = 0;
            let failed  = 0;

            for (const run of toDelete) {
              const label = `#${run.run_number} "${run.name}" (${run.created_at})`;

              if (dryRun) {
                core.info(`[dry-run] Would delete ${label}`);
                deleted++;
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
                core.info(`Deleted ${label}`);
              } catch (error) {
                if (error.status === 404) {
                  skipped++;
                  core.info(`Skipped ${label} — already gone.`);
                  continue;
                }
                failed++;
                core.warning(`Failed ${label}: ${error.message}`);
              }
            }

            // ── Summary ──────────────────────────────────────────────
            const remaining = Math.max(0, candidates.length - toDelete.length);

            await core.summary
              .addHeading("🧹 Janitor cleanup")
              .addTable([
                [{ data: "Metric", header: true }, { data: "Value", header: true }],
                ["Mode",                   dryRun ? "🔍 Dry run" : "🗑️ Live"],
                ["Cutoff",                 cutoff.toISOString()],
                ["Completed runs in repo", String(runs.length)],
                ["Expired (eligible)",     String(candidates.length)],
                ["Deleted",                String(deleted)],
                ["Skipped (already gone)", String(skipped)],
                ["Failed",                 String(failed)],
                ["Deferred to next run",   String(remaining)],
              ])
              .write();

            core.info(
              `Done: ${deleted} deleted, ${skipped} skipped, ${failed} failed, ${remaining} deferred.`
            );

            if (failed > 0 && deleted === 0) {
              core.setFailed(
                `All ${failed} deletion(s) failed — check the workflow token's actions:write permission.`
              );
            }
